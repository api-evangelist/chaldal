name: Chaldal
description: >-
  Chaldal is Bangladesh's largest online grocery delivery platform, founded in 2013 in Dhaka. It
  pioneered the "dark store" micro-warehouse model to deliver fresh food, groceries, personal care,
  and baby products within one hour across Dhaka, Narayanganj, Chittagong, Jashore, Khulna, Sylhet,
  and Rajshahi. Beyond retail grocery, Chaldal has built out supply-chain, agriculture, and
  logistics technology, including its Gogo Bangla / "Egg Transport" third-party-logistics arm, which
  exposes a public B2B delivery API. Backed by Y Combinator and 500 Global, Chaldal partners with
  the UN World Food Programme, UNDP, USAID, and the World Bank. Its engineering stack is F#/.NET
  Core, Scala, Python, and React/React Native. This profile was enriched by the API Evangelist
  pipeline from Chaldal's public developer surface.
