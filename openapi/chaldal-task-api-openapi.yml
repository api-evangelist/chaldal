          x-nullable: false
          description: Task Tracking Refs
          schema:
            type: string
        '400':
          description: ''
        '401':
          description: Not logged in
        '403':
          description: Not authorized to Create shipments for Org
  /api/Task/SearchTasksForMyOrg:
