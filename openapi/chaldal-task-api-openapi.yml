components:
  schemas:
    BulkTaskUploadDto:
      type: object
      required:
      - merchantPickupPointAddressId
      properties:
        csv:
          type: string
        merchantPickupPointAddressId:
          type: integer
          format: int32
    ValidationResultOfUnsignedDecimal:
      type: object
      x-abstract: true
    TaskDto:
      type: object
      required:
      - cashToCollect
      - stockValue
      properties:
        trackingRef:
          type: string
        merchantRef:
          type: string
        physique:
          $ref: '#/components/schemas/PhysiqueDto'
        addressInfo:
          $ref: '#/components/schemas/AddressInfoDto'
        slotStart:
          $ref: '#/components/schemas/FSharpOptionOfDateTimeOffset'
        slotEnd:
          $ref: '#/components/schemas/FSharpOptionOfDateTimeOffset'
        cashToCollect:
          type: number
          format: decimal
        stockValue:
          type: number
          format: decimal
        weight:
          type: string
        status:
          type: string
        taskType:
          type: string
        merchantHub:
          $ref: '#/components/schemas/FSharpOptionOfString'
        notes:
          type: array
          items:
            $ref: '#/components/schemas/TaskNoteDto'
    ConfidenceLevelDto:
      type: object
    TaskAuditTrail:
      type: object
      required:
      - lastActionOn
      - stateTransitionedOn
      properties:
        tripStatus:
          type: string
        lastActionOn:
          type: string
          format: date-time
        stateTransitionedOn:
          type: string
          format: date-time
        failedOrRejectReason:
          $ref: '#/components/schemas/FSharpOptionOfString'
    PhysiqueDto:
      type: object
      x-abstract: true
    ValidatedRow:
      type: object
      properties:
        merchantRef:
          $ref: '#/components/schemas/ValidationResultOfString'
        name:
          $ref: '#/components/schemas/ValidationResultOfString'
        address:
          $ref: '#/components/schemas/ValidationResultOfString'
        phone:
          $ref: '#/components/schemas/ValidationResultOfString'
        amountToCollect:
          $ref: '#/components/schemas/ValidationResultOfUnsignedDecimal'
        stockValue:
          $ref: '#/components/schemas/ValidationResultOfUnsignedDecimal'
        note:
          $ref: '#/components/schemas/ValidationResultOfString'
    TaskCreateDto:
      type: object
      required:
      - refId
      - physique
      - address
      - cashToCollect
      - stockValue
      - note
      properties:
        refId:
          type: string
          minLength: 1
        physique:
          $ref: '#/components/schemas/PhysiqueDto'
        address:
          $ref: '#/components/schemas/AddressInputDto'
        slotStart:
          $ref: '#/components/schemas/FSharpOptionOfDateTimeOffset'
        slotEnd:
          $ref: '#/components/schemas/FSharpOptionOfDateTimeOffset'
        cashToCollect:
          type: number
          format: decimal
        stockValue:
          type: number
          format: decimal
        note:
          type: string
          minLength: 1
        merchantPickupPointAddressId:
          $ref: '#/components/schemas/AddressId'
    TaskNoteDto:
      type: object
      required:
      - noteId
      - createdOn
      - createdBy
      properties:
        noteId:
          type: string
          format: guid
        createdOn:
          type: string
          format: date-time
        createdBy:
          type: string
          format: guid
        note:
          type: string
    AddressId:
      type: object
    TupleOfStringAndTaskDto:
      type: object
      required:
      - item1
      - item2
      properties:
        item1:
          type: string
        item2:
          $ref: '#/components/schemas/TaskDto'
    FailureAlertDto:
      type: object
      properties:
        task:
          $ref: '#/components/schemas/TaskDto'
        message:
          type: string
    AddressInfoDto:
      type: object
      required:
      - identity
      properties:
        address:
          $ref: '#/components/schemas/AddressIdDto'
        identity:
          type: string
          format: guid
        fullName:
          type: string
        streetAddress:
          type: string
        phoneNumber:
          type: string
        deliveryArea:
          $ref: '#/components/schemas/DeliveryAreaDto'
        customerHub:
          type: string
        geoLocation:
          $ref: '#/components/schemas/FSharpOptionOfGeoLocationDto'
        confidenceLevel:
          $ref: '#/components/schemas/ConfidenceLevelDto'
    AddressIdDto:
      type: object
    ExchangeTaskCreateDto:
      type: object
      required:
      - refId
      - deliveryPhysique
      - pickUpPhysique
      - address
      - cashToCollect
      - deliveryStockValue
      - pickUpStockValue
      - note
      properties:
        refId:
          type: string
          minLength: 1
        deliveryPhysique:
          $ref: '#/components/schemas/PhysiqueDto'
        pickUpPhysique:
          $ref: '#/components/schemas/PhysiqueDto'
        address:
          $ref: '#/components/schemas/AddressInputDto'
        slotStart:
          $ref: '#/components/schemas/FSharpOptionOfDateTimeOffset'
        slotEnd:
          $ref: '#/components/schemas/FSharpOptionOfDateTimeOffset'
        cashToCollect:
          type: number
          format: decimal
        deliveryStockValue:
          type: number
          format: decimal
