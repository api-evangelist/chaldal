        name: searchText
        in: query
        x-nullable: true
      - type: string
        name: taskType
        in: query
        x-nullable: true
      - type: string
        name: fromDate
        in: query
        x-nullable: true
      - type: string
        name: toDate
        in: query
        x-nullable: true
      - type: string
        name: highLevelStatus
        in: query
        x-nullable: true
      - type: integer
        name: pageNum
        in: query
        x-nullable: false
      - type: integer
        name: pageSize
        in: query
        x-nullable: false
      responses:
        '200':
          x-nullable: false
          description: Paginated Results
          schema:
            type: array
            items:
              $ref: '#/definitions/TaskDto'
        '401':
          description: Not logged in
