                items:
                  $ref: '#/components/schemas/ValidatedRow'
      requestBody:
        content:
          application/json-patch+json:
            schema:
              type: string
          application/json:
            schema:
              type: string
          text/json:
            schema:
              type: string
          application/*+json:
            schema:
              type: string
        required: true
      summary: Task validate task import csv
      x-summary-source: derived
  /api/Task/ImportTasksToMyOrg:
    post:
      tags:
      - Task
      operationId: Task_ImportTasksToMyOrg
      responses:
        '204':
          description: Success
        '400':
          description: When CSV has validation errors (if CSV is parsable, ValidatedRows are returned)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ValidatedRow'
        '401':
          description: When unauthenticated
        '403':
          description: When not authorized
      requestBody:
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/BulkTaskUploadDto'
          application/json:
            schema:
              $ref: '#/components/schemas/BulkTaskUploadDto'
          text/json:
            schema:
