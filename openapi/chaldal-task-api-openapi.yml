swagger: '2.0'
info:
  title: My Title Accounts Task API
  version: 1.0.0
host: eggtransport.chaldal.com
schemes:
- https
tags:
- name: Task
paths:
  /api/Task/GetQrCodeBinary:
    get:
      tags:
      - Task
      operationId: Task_GetQrCodeBinary
      produces:
      - text/plain
      - text/csv
      - application/json
      - text/json
      parameters:
      - type: string
        name: trackingRef
        in: query
        x-nullable: true
      - type: integer
        name: side
        in: query
        format: int32
        x-nullable: false
      responses:
        '200':
          x-nullable: false
          description: Binary PNG Image
          schema:
            type: string
            format: byte
        '401':
          description: Not logged in
        '404':
          description: Invalid TrackingRef
        '400':
          description: Invalid Dimensions
  /api/Task/GetTaskStatus:
    get:
      tags:
      - Task
      operationId: Task_GetTaskStatus
      produces:
      - text/plain
      - text/csv
      - application/json
      - text/json
      parameters:
      - type: string
        name: trackingRef
        in: query
        x-nullable: true
      responses:
        '200':
          x-nullable: false
          description: Simplified Task Status
          schema:
            type: string
        '404':
          description: Invalid TrackingRef
  /api/Task/GetTasks:
    post:
      tags:
      - Task
      operationId: Task_GetTasks
      consumes:
      - application/json-patch+json
      - application/json
      - text/json
      - application/*+json
      produces:
      - text/plain
      - text/csv
      - application/json
      - text/json
      parameters:
      - name: trackingRefs
        in: body
        required: true
        schema:
          type: array
          items:
            type: string
        x-nullable: false
      responses:
        '200':
          x-nullable: false
          description: Tasks By Tracking Ref
          schema:
            $ref: '#/definitions/FSharpMapOfStringAndTaskDto'
        '401':
          description: Not logged in
        '403':
          description: No access to task
  /api/Task/GetTasksStatuses:
    post:
      tags:
      - Task
      operationId: Task_GetTasksStatuses
      produces:
      - text/plain
      - text/csv
      - application/json
      - text/json
      parameters:
      - type: string
        name: trackingRefsCsv
        in: query
        x-nullable: true
      responses:
        '200':
          x-nullable: false
          description: Task status by tracking ref
          schema:
            $ref: '#/definitions/FSharpMapOfStringAndString'
        '400':
          description: No tracking refs specified
  /api/Task/CreateThirdPartyDeliveryTask:
    post:
      tags:
      - Task
      operationId: Task_CreateThirdPartyDeliveryTask
      consumes:
      - application/json-patch+json
      - application/json
      - text/json
      - application/*+json
      produces:
      - text/plain
      - text/csv
      - application/json
      - text/json
      parameters:
      - name: dto
        in: body
        required: true
        schema:
          $ref: '#/definitions/TaskCreateDto'
        x-nullable: false
      responses:
        '200':
          x-nullable: false
          description: Task Tracking Ref
          schema:
            type: string
        '400':
          description: ''
        '401':
          description: Not logged in
        '403':
          description: Not authorized to Create shipments for Org
  /api/Task/CreateThirdPartyPickUpTask:
    post:
      tags:
      - Task
      operationId: Task_CreateThirdPartyPickUpTask
      consumes:
      - application/json-patch+json
      - application/json
      - text/json
      - application/*+json
      produces:
      - text/plain
      - text/csv
      - application/json
      - text/json
      parameters:
      - name: dto
        in: body
        required: true
        schema:
