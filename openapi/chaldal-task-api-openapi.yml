      summary: Task search tasks for my org
      x-summary-source: derived
  /api/Task/OrgCancelTask:
    post:
      tags:
      - Task
      operationId: Task_OrgCancelTask
      parameters:
      - name: trackingRef
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Cancelled Task
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/TaskDto'
            text/csv:
              schema:
                $ref: '#/components/schemas/TaskDto'
            application/json:
              schema:
                $ref: '#/components/schemas/TaskDto'
            text/json:
              schema:
                $ref: '#/components/schemas/TaskDto'
        '404':
          description: Invalid TrackingRef
        '412':
          description: Task's current state does not allow this action
        '400':
          description: Invalid request params
        '401':
          description: Not logged in
        '403':
          description: Not allowed to perform this action
        '409':
          description: Concurrent modification
      summary: Task org cancel task
      x-summary-source: derived
  /api/Task/ValidateTaskImportCsv:
    post:
      tags:
      - Task
      operationId: Task_ValidateTaskImportCsv
      responses:
        '200':
          description: '`ValidatedRow`s'
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ValidatedRow'
            text/csv:
              schema:
                type: array
                items:
