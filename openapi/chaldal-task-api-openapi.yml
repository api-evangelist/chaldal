openapi: 3.2.0
info:
  title: My Title Task API
  version: 1.0.0
servers:
- url: https://eggtransport.chaldal.com
tags:
- name: Task
paths:
  /api/Task/GetQrCodeBinary:
    get:
      tags:
      - Task
      operationId: Task_GetQrCodeBinary
      parameters:
      - name: trackingRef
        in: query
        schema:
          type: string
      - name: side
        in: query
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Binary PNG Image
          content:
            text/plain:
              schema:
                type: string
                format: byte
            text/csv:
              schema:
                type: string
                format: byte
            application/json:
              schema:
                type: string
                format: byte
            text/json:
              schema:
                type: string
                format: byte
        '401':
          description: Not logged in
        '404':
          description: Invalid TrackingRef
        '400':
          description: Invalid Dimensions
      summary: Task get qr code binary
      x-summary-source: derived
  /api/Task/GetTaskStatus:
    get:
      tags:
      - Task
      operationId: Task_GetTaskStatus
      parameters:
      - name: trackingRef
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Simplified Task Status
          content:
            text/plain:
              schema:
                type: string
            text/csv:
              schema:
                type: string
            application/json:
              schema:
                type: string
            text/json:
              schema:
                type: string
        '404':
          description: Invalid TrackingRef
      summary: Task get task status
      x-summary-source: derived
  /api/Task/GetTasks:
    post:
      tags:
      - Task
      operationId: Task_GetTasks
      responses:
        '200':
          description: Tasks By Tracking Ref
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/FSharpMapOfStringAndTaskDto'
            text/csv:
              schema:
                $ref: '#/components/schemas/FSharpMapOfStringAndTaskDto'
            application/json:
              schema:
                $ref: '#/components/schemas/FSharpMapOfStringAndTaskDto'
            text/json:
              schema:
                $ref: '#/components/schemas/FSharpMapOfStringAndTaskDto'
        '401':
          description: Not logged in
        '403':
          description: No access to task
      requestBody:
        content:
          application/json-patch+json:
            schema:
              type: array
              items:
                type: string
          application/json:
            schema:
              type: array
              items:
                type: string
          text/json:
            schema:
              type: array
              items:
                type: string
          application/*+json:
            schema:
              type: array
              items:
                type: string
        required: true
      summary: Task get tasks
      x-summary-source: derived
  /api/Task/GetTasksStatuses:
    post:
      tags:
      - Task
      operationId: Task_GetTasksStatuses
      parameters:
      - name: trackingRefsCsv
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Task status by tracking ref
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/FSharpMapOfStringAndString'
            text/csv:
              schema:
                $ref: '#/components/schemas/FSharpMapOfStringAndString'
            application/json:
              schema:
                $ref: '#/components/schemas/FSharpMapOfStringAndString'
            text/json:
              schema:
                $ref: '#/components/schemas/FSharpMapOfStringAndString'
        '400':
          description: No tracking refs specified
      summary: Task get tasks statuses
      x-summary-source: derived
  /api/Task/CreateThirdPartyDeliveryTask:
