          type: string
      - name: fromDate
        in: query
        schema:
          type: string
      - name: toDate
        in: query
        schema:
          type: string
      - name: highLevelStatus
        in: query
        schema:
          type: string
      - name: pageNum
        in: query
        schema:
          type: integer
      - name: pageSize
        in: query
