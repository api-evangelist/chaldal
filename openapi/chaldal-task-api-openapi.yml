        '403':
          description: Not authorized
      summary: Task get tasks with failure alerts for my org
      x-summary-source: derived
  /api/Task/ConsolidateTasksForMyOrg:
    post:
      tags:
      - Task
      operationId: Task_ConsolidateTasksForMyOrg
      responses:
        '401':
          description: Not logged in
        '403':
          description: Not authorized
        '404':
          description: If one or more tracking refs is invalid
        '204':
          description: Ok
      requestBody:
        content:
          application/json-patch+json:
            schema:
              type: array
              items:
                type: string
          application/json:
            schema:
              type: array
              items:
                type: string
          text/json:
            schema:
              type: array
              items:
                type: string
          application/*+json:
            schema:
              type: array
              items:
                type: string
        required: true
      summary: Task consolidate tasks for my org
      x-summary-source: derived
  /api/Task/CancelTasksForMyOrg:
